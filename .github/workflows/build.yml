name: Build APK

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.4'

      - name: Verify source archive
        run: python3 scripts/package_source.py --check

      - name: Run unit tests, debug APK, and release R8 APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain testDebugUnitTest assembleDebug assembleRelease 2>&1 | tee gradle-build.log

      - name: Audit Release APK, DEX, and R8 Mapping
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, zipfile

          lines = ["### Release Hardening & Optimization Audit", ""]
          debug_apks = sorted(glob.glob("app/build/outputs/apk/debug/*.apk"))
          release_apks = sorted(glob.glob("app/build/outputs/apk/release/*.apk"))
          for p in debug_apks:
              lines.append(f"- Debug APK: `{os.path.basename(p)}` — {os.path.getsize(p) / (1024*1024):.2f} MB ({os.path.getsize(p):,} bytes)")
          for p in release_apks:
              lines.append(f"- Release APK: `{os.path.basename(p)}` — {os.path.getsize(p) / (1024*1024):.2f} MB ({os.path.getsize(p):,} bytes)")
              with zipfile.ZipFile(p) as zf:
                  names = zf.namelist()
                  dex_files = [n for n in names if n.endswith(".dex")]
                  so_files = [n for n in names if n.endswith(".so")]
                  debug_probes = [n for n in names if "DebugProbesKt.bin" in n]
                  lines.append(f"- Release DEX count: {len(dex_files)} ({', '.join(dex_files)})")
                  lines.append(f"- Release native .so count: {len(so_files)} ({', '.join(so_files)})")
                  lines.append(f"- DebugProbesKt.bin present: {bool(debug_probes)}")
                  reflect_hits = 0
                  probe_impl_hits = 0
                  for d in dex_files:
                      data = zf.read(d)
                      if b"kotlin/reflect/" in data or b"Lkotlin/reflect/" in data:
                          reflect_hits += 1
                      if b"DebugProbesImpl" in data:
                          probe_impl_hits += 1
                  lines.append(f"- DEX `kotlin/reflect` hits: {reflect_hits}")
                  lines.append(f"- DEX `DebugProbesImpl` hits: {probe_impl_hits}")

          mapping_path = "app/build/outputs/mapping/release/mapping.txt"
          if os.path.exists(mapping_path):
              mapping_text = open(mapping_path, encoding="utf-8", errors="ignore").read()
              obf_samples = []
              for target in ("InferenceEngineManager", "AgentToolLoop", "PdfTextExtractor"):
                  for line in mapping_text.splitlines():
                      if line.startswith(f"com.example.pocketagent.{target} -> "):
                          obf_samples.append(line.rstrip(":"))
                          break
              lines.append(f"- R8 mapping.txt size: {os.path.getsize(mapping_path):,} bytes")
              for s in obf_samples:
                  lines.append(f"  - `{s}`")

          report = "\n".join(lines) + "\n"
          with open("release-audit.txt", "w", encoding="utf-8") as f:
              f.write(report)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as s:
                  s.write("\n" + report)
          print(report)
          PY

      - name: Summarize Gradle failure
        if: failure()
        shell: bash
        run: |
          {
            echo '### Gradle build failure (last 160 lines)'
            echo '```text'
            tail -n 160 gradle-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '(^e: |error:|What went wrong|Execution failed|Could not resolve|Could not find|A problem occurred)' gradle-build.log | tail -n 20 | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done

      - name: Summarize unit-test failures
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          reports = glob.glob('app/build/test-results/testDebugUnitTest/*.xml')
          entries = []
          for report in reports:
              root = ET.parse(report).getroot()
              for case in root.iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      detail = (failure.get('message', '') + '\n' + (failure.text or '')).strip()
                      entries.append((case.get('classname', ''), case.get('name', ''), detail))
          if entries:
              summary = os.environ.get('GITHUB_STEP_SUMMARY')
              with open(summary, 'a', encoding='utf-8') as out:
                  out.write('### Unit-test failures\n')
                  for cls, name, detail in entries:
                      out.write(f'\n- `{cls}.{name}`\n\n```text\n{detail[:6000]}\n```\n')
              for cls, name, detail in entries:
                  print(f'::error title=Unit test failed::{cls}.{name}: {detail[:3000]}')
          else:
              print('No JUnit XML failures were available.')
          PY

      - name: Upload Gradle failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PocketAgent-gradle-failure-log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish compile errors for sandbox debugging
        if: failure()
        shell: bash
        run: |
          {
            echo "# CI compile errors"
            echo
            echo "## kotlin e: lines"
            echo '```'
            grep -n "e: " gradle-build.log | head -200 || true
            echo '```'
            echo
            echo "## first failure context"
            echo '```'
            grep -B20 -A80 "Compilation error" gradle-build.log | head -120 || true
            echo '```'
          } > CI_ERRORS.md
          git config user.name "ci-debug"
          git config user.email "ci-debug@users.noreply.github.com"
          git add CI_ERRORS.md
          git commit -m "ci: publish compile errors [skip ci]" || true
          git push origin HEAD:${GITHUB_REF_NAME} || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketAgent-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK & Audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PocketAgent-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            release-audit.txt
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14
