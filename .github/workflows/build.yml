name: Build APK

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.4'

      - name: Assemble debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain assembleDebug 2>&1 | tee gradle-build.log

      - name: Summarize Gradle failure
        if: failure()
        shell: bash
        run: |
          {
            echo '### Gradle build failure (last 160 lines)'
            echo '```text'
            tail -n 160 gradle-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '(^e: |error:|What went wrong|Execution failed|Could not resolve|Could not find|A problem occurred)' gradle-build.log | tail -n 20 | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done

      - name: Upload Gradle failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PocketAgent-gradle-failure-log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketAgent-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
