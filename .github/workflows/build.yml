name: Build APK

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify source archive
        run: python3 scripts/package_source.py --check

      - name: Run unit tests and assemble debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --console=plain testDebugUnitTest assembleDebug 2>&1 | tee gradle-build.log

      - name: Verify screenshot baselines
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain verifyRoborazziDebug 2>&1 | tee screenshot-verify.log

      # Discovery pass: findings are collected from the artifacts, fixed in source,
      # then continue-on-error is removed so both gates become required.
      - name: Android lint (discovery)
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain lintDebug 2>&1 | tee lint-debug.log

      - name: Detekt (discovery)
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain detekt 2>&1 | tee detekt.log

      - name: Summarize Gradle failure
        if: failure()
        shell: bash
        run: |
          {
            echo '### Gradle build failure (last 160 lines)'
            echo '```text'
            tail -n 160 gradle-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '(^e: |error:|What went wrong|Execution failed|Could not resolve|Could not find|A problem occurred)' gradle-build.log | tail -n 20 | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done

      - name: Summarize unit-test failures
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          reports = glob.glob('app/build/test-results/testDebugUnitTest/*.xml')
          entries = []
          for report in reports:
              root = ET.parse(report).getroot()
              for case in root.iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      detail = (failure.get('message', '') + '\n' + (failure.text or '')).strip()
                      entries.append((case.get('classname', ''), case.get('name', ''), detail))
          if entries:
              summary = os.environ.get('GITHUB_STEP_SUMMARY')
              with open(summary, 'a', encoding='utf-8') as out:
                  out.write('### Unit-test failures\n')
                  for cls, name, detail in entries:
                      out.write(f'\n- `{cls}.{name}`\n\n```text\n{detail[:6000]}\n```\n')
              for cls, name, detail in entries:
                  print(f'::error title=Unit test failed::{cls}.{name}: {detail[:3000]}')
          else:
              print('No JUnit XML failures were available.')
          PY

      - name: Upload Gradle failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PocketAgent-gradle-failure-log
          path: |
            gradle-build.log
            screenshot-verify.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PocketAgent-quality-reports
          path: |
            lint-debug.log
            detekt.log
            app/build/reports/detekt
            app/build/reports/lint-results-debug.txt
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketAgent-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload screenshot reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PocketAgent-screenshot-reports
          path: |
            app/build/reports/roborazzi
            app/build/test-results
          if-no-files-found: ignore
          retention-days: 14

  record-screenshots:
    name: Record screenshot baselines
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Record screenshots
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain recordRoborazziDebug 2>&1 | tee screenshot-record.log

      - name: Upload recorded baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PocketAgent-screenshot-baselines
          path: |
            app/src/screenshots
            app/build/reports/roborazzi
          if-no-files-found: error
          retention-days: 30

  device-smoke:
    name: Device smoke (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 28
            target: google_apis
          # The API 35 google_apis launcher can ANR with "Application does not have a
          # focused window", which leaves Espresso roots permanently focusless. The
          # offline app has no GMS dependency, so use the AOSP image on that leg.
          - api-level: 35
            target: default
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          id
          test -w /dev/kvm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate offline fixtures
        run: python3 scripts/generate_smoke_fixtures.py

      - name: Run connected Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_xl
          disable-animations: true
          disable-linux-hw-accel: false
          script: |
            mkdir -p app/build/reports
            ./gradlew --no-daemon --stacktrace --console=plain connectedDebugAndroidTest > app/build/reports/connected-test.log 2>&1; STATUS=$?; cat app/build/reports/connected-test.log; adb logcat -d > app/build/reports/logcat.txt || true; exit "$STATUS"

      - name: Reject false-green device runs
        if: always()
        run: |
          log=app/build/reports/connected-test.log
          if [ ! -f "$log" ]; then
            echo "::error::connected-test.log missing; cannot prove tests ran"
            exit 1
          fi
          if grep -qE 'Starting 0 tests|Finished 0 tests' "$log"; then
            echo "::error::emulator discovered zero tests (legacy runner regression)"
            exit 1
          fi
          if ! grep -qE '^Finished [1-9][0-9]* tests' "$log"; then
            echo "::error::no completed device test run found in connected-test.log"
            exit 1
          fi
          grep -E '^(Starting|Finished) [0-9]+ tests' "$log"

      - name: Upload device reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PocketAgent-device-reports-api-${{ matrix.api-level }}
          path: |
            app/build/reports
            app/build/test-results
          if-no-files-found: ignore
          retention-days: 14
