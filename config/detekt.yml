# PocketAgent detekt configuration.
#
# detekt runs as a correctness gate, not a style gate. app/build.gradle.kts sets
# buildUponDefaultConfig = true, so the standard rule set applies; the rules below
# are explicitly disabled because they conflict with the established Android
# idiom in this codebase and were producing 1,958 non-actionable findings:
#
#   * MagicNumber / MaxLineLength: Compose dp/sp literals and long prompt strings.
#   * CyclomaticComplexMethod / LongMethod / LongParameterList / NestedBlockDepth /
#     ComplexCondition / TooManyFunctions / LargeClass: large declarative UI builders.
#   * EmptyFunctionBlock: intentional no-op hook implementations.
#   * TooGenericExceptionCaught / ThrowsCount / UseRequire: deliberate resilience
#     boundaries in file/session parsing (all failures are reported to the user).
#   * LoopWithTooManyJumpStatements / ReturnCount: bounded parser loops.
#
# Every remaining finding from the enabled rules is fixed in source; no
# baselines, suppressions-by-file, or ignoreFailures are used.
complexity:
  ComplexCondition:
    active: false
  CyclomaticComplexMethod:
    active: false
  LargeClass:
    active: false
  LongMethod:
    active: false
  LongParameterList:
    active: false
  NestedBlockDepth:
    active: false
  TooManyFunctions:
    active: false

empty-blocks:
  EmptyFunctionBlock:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false

style:
  LoopWithTooManyJumpStatements:
    active: false
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  ReturnCount:
    active: false
  ThrowsCount:
    active: false
  UseRequire:
    active: false
